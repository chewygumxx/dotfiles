#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/dotfiles.git
# ::: :/.config/mise/tasks/act.toml
#
#

#
# See README.md of <https://github.com/chewygumxx/.github>
#

# Wrapper to refresh remote task data upon every execution. mise only
# fetches `git::` task files with experimental features on, enabled here
# rather than in mise.toml, whose [settings] would demand `mise trust`. This
# repo has no ci.yaml, the remote task's default workflow; ACT_WORKFLOW
# picks another one.
[act]
description = "Locally execute GitHub Actions (CI) with Docker"
run         = 'MISE_EXPERIMENTAL=1 ACT_WORKFLOW="${ACT_WORKFLOW:-lint-config.yaml}" mise run --no-cache act-cached'
alias       = [
    "exec-ci",
    "exec-gh-act",
    "exec-gh-actions",
]

[act-cached]
description = "[Internal] Locally execute GitHub Actions (CI) with Docker"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"
hide        = true
