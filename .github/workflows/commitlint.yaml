name: Lint Commit Messages

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read
    pull-requests: read

jobs:
    commitlint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4"

            - run: bun install --frozen-lockfile

            # From the base, not head~<commits>: ~ follows first parents, so a
            # PR containing merges linted unrelated commits instead of its own
            - name: Lint pull request commits
              if: github.event_name == 'pull_request'
              run: bunx --bun --no-install commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

            # Every pushed commit, not only the last: --last saw just the merge
            # commit of a merged PR. A new branch has no before, so fall back.
            - name: Lint pushed commits
              if: github.event_name != 'pull_request'
              env:
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.sha }}
              run: |
                  if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                      bunx --bun --no-install commitlint --from "$BEFORE" --to "$AFTER" --verbose
                  else
                      bunx --bun --no-install commitlint --last --verbose
                  fi
