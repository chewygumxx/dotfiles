#:schema https://clawdipedia.cc/schemas/claude-code-settings.json

#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_local/share/claude/settings/hooks.toml
#
#

disableAllHooks = false

[[hooks.SessionStart]]
matcher = "*"

[[hooks.SessionStart.hooks]]
type    = "command"
command = """
sh -c "bash '${CLAUDE_CONFIG_DIR:=$HOME/.claude}/hooks/herdr-agent-state.sh' session"
"""
timeout = 10
