model          = "opus"
outputStyle    = "default"
effortLevel    = "high"
maxEffortLevel = "xhigh"


# Requires feature-flags
advisorModel  = "claude-opus-5-5"
fallbackModel = [
    "claude-sonnet-5-5",
    "claude-sonnet-5",
]

enforceAvailableModels = false
availableModels        = [
    "wintermute",
    "mythos",
    "fable",
    "opus",
    "sonnet",
    "haiku",
]

fastMode                = false
fastModePerSessionOptIn = true
alwaysThinkingEnabled   = true
switchModelsOnFlag      = false

[modelSettings]
claude-opus-5-5   = { effortLevel = "high", maxEffortLevel = "xhigh" }
claude-sonnet-5-5 = { effortLevel = "high", maxEffortLevel = "high" }
