# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://clawdipedia.cc/schemas/claude-code-settings.json

#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_local/share/claude/settings/permissions-automode.toml
#
#


useAutoModeDuringPlan             = true
skipAutoPermissionPrompt          = true
skipDangerousModePermissionPrompt = true

[permissions]
defaultMode            = "auto"
# disableBypassPermissionsMode = "disable"
denyInsteadOfPrompting = false

blockReadsOutsideWorkingDirectories  = false
blockWritesOutsideWorkingDirectories = false

additionalDirectories = [ "~/dev/shared-config/" ]
allow                 = [
    "Bash(gh pr merge:*)",
    "Bash(git push origin --delete:*)",
    "Bash(git branch -D:*)",
]
deny                  = [
    "Read(/etc/wireguard/**)",
    "Read(~/.config/cloudflare-ddns/**)",
    "Read(~/.config/gh/hosts.yml)",
    "Read(~/.config/wireguard/**)",
    "Read(~/.gnupug/**)",
    "Read(~/.local/share/gnupg/**)",
    "Read(~/.netrc)",
    "Read(~/.ssh/**)",
    "Read(~/doc/**)",
    "Read(~/sec/**)",
    "Bash(chmod -R 777*)",
    "Bash(git fpush)",
    "Bash(git push --force*)",
    "Bash(gtrash force *)",
    "Bash(gtrash rm *)",
    "Bash(rm -rf /)",
    "Bash(rm -rf ~)",
    "Bash(rm -rf ~*)",
    "Bash(rm -rf .)",
]

[autoMode]
allow       = [
    "$defaults",
    "In github.com/chewygumxx/dorothy, opening pull requests and merging ones the agent opened once CI passes is allowed: the user has given standing approval.",
    "Deleting branches of github.com/chewygumxx/dorothy that are merged or that the user named is allowed.",
    "Writing the agent's own memory under .agents/memory/ in the repository is allowed: the user reviews it in git.",
]
environment = [
    "### Org-wide",
    "**Organization**: None configured",
    "**Cloud provider(s)**: None configured",

    "**Repository visibility**: Not queryable via gh (nonessential traffic disabled or policy-restricted); origin is github.com:chewygumxx/dorothy.git — treat as possibly public per shipped-default guidance until verified",
    "**Internal sharing / snippet hosting**: None configured — treat public paste/gist services as outside the trust boundary",
    "**Secrets management**: repo contains secrets-related tooling (scripts/check-secrets.sh, packages/core/src/secrets.ts, secrets.json, docs/plans/2026-10-21-sops-secrets.md) and mise supplies sops/age per README — no secrets backend or policy confirmed beyond that",
    "**Default / protected branches**: main (default branch per repo facts); protected-branch/ruleset status not queryable via gh here",

    "**CI/CD deploy targets**: None configured",
    "**Network posture**: None configured",
    "**Host containment**: None configured — assume Claude Code runs on an ordinary developer machine or CI runner with open internet",
    "**Source control**: The trusted repo (github.com/chewygumxx/dorothy) and its origin remote only",
    "**Trusted internal domains**: None configured",
    "**Trusted cloud buckets**: None configured",
    "**Key internal services**: None configured",
    "**Internal package registry**: None configured",

    """
    **Sensitive data locations & audiences**: Share only with audiences cleared at the [named+specifics] bar

    - scripts/check-secrets.sh,
    - scripts/check-secrets.test.ts,
    - secrets.json,
    - packages/core/src/secrets.ts,
    - packages/core/src/secrets.test.ts,
    - packages/eval/src/secrets.ts,
    - docs/plans/2026-10-21-sops-secrets.md,
    - docs/reports/2026-10-21-sops-secrets.md,
    - docs/specs/2026-10-21-sops-secrets-design.md,
    - and any .env*/*.env/keys.txt file
    """,

    "**Data retention / declassification**: None configured",
    "**Sensitive remote targets**: any namespace, host, or container whose name carries prod or production as a whole word or name segment",
    "**Protected deployment namespaces / environments**: None configured — fall back to the Sensitive remote targets heuristic",
    "**Protected IaC scopes**: IAM, RBAC, networking, quota, and node-pool resources; anything whose name or tag carries prod or production as a whole word or name segment",

    "### User-specific",
    "**Primary use of Claude Code**: software development (Dorothy — conversational LLM interface, built on the Claude Agent SDK)",
    "**Trusted repo**: ~/dev/dorothy (github.com/chewygumxx/dorothy, origin remote) — visibility unverified, treat as possibly public",
    "**Org-specific CLIs**: None configured — bunx, herdr, hdr, ugrep seen in project usage but no org affiliation evidenced",
    "**routine under chewygumxx/ prefix**: repos under github.com/chewygumxx/* found on disk (userstyle, zsh-config, nex, header-metadata.nvim, github-personal-playground, zsh-vi-mode, zsh-shell-template, shared-config, dorothy-memory, zsh-als, fork_meteor, dorothy-hermes, lazy.nvim, cloudflare-url-shorten, chezmoi-apply-xattr, cclip-fzf, hashmark) are the same author's personal checkouts, not vetted org context — scope stays limited to this project per Q2",
]
