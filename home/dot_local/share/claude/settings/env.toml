#

#
# Environment variables Claude Code applies to every session, however
# `claude` was started: the ~/.local/bin wrapper, a child Claude Code
# launches from its own executable, or anything else. A value here overrides
# the same variable exported by the launching shell.
#
# Only variables without a dedicated settings key belong here. The few Claude
# Code ignores in an `env` block (CLAUDE_CONFIG_DIR's lookup,
# CLAUDE_CODE_PROJECT_DIR_NAME, the rm safety switches) stay in
# ~/.local/share/claude/bin/claude.
#
# https://code.claude.com/docs/en/env-vars
#

[env]
# ----------
# Telemetry
# ----------

# DO_NOT_TRACK                             = "1"
# DISABLE_TELEMETRY                        = "1"
# Also disables auto-updates, error reporting, /feedback and release notes.
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
# Feature flags also treat pasted content differently (herdr agent prompt)
# CLAUDE_CODE_DISABLE_FEATURE_FLAGS        = "1"

# --------
# Updates
# --------

# pacman owns the install. Also blocks `claude update` and `claude install`,
# which would write ~/.local/bin/claude and versions/ into CLAUDE_CONFIG_DIR.
DISABLE_UPDATES = "1"

# ---------
# Features
# ---------

# Firefox tabs and this are not a vibe
CLAUDE_CODE_DISABLE_BG_SHELL_PRESSURE_REAP = "1"

# `fastMode = false` only sets the default; this removes /fast altogether.
CLAUDE_CODE_DISABLE_FAST_MODE = "1"

# I never use these
CLAUDE_CODE_DISABLE_CRON                             = "1"
CLAUDE_CODE_DISABLE_TERMINAL_TITLE                   = "1"
CLAUDE_CODE_DISABLE_FILE_MENTIONS                    = "1"
CLAUDE_CODE_DISABLE_ATTACHMENTS                      = "1"
CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL = "1"
CLAUDE_CODE_DISABLE_AUTH_REFRESH_LOCK                = "1"
CLAUDE_CODE_DISABLE_CFC_PROMPT                       = "1"
DISABLE_COST_WARNINGS                                = "1"
DISABLE_EXTRA_USAGE_COMMAND                          = "1"
DISABLE_INSTALL_GITHUB_APP_COMMAND                   = "1"

# -------
# Values
# -------

# 24 hours. Read once per launch.
CLAUDE_CODE_WEBFETCH_CACHE_TTL_MS = "86400000"
# Absolute: settings values are not shell-expanded.
CLAUDE_CODE_TMPDIR                = "/tmp/agents"
