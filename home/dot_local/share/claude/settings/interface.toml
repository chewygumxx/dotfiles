#:schema https://clawdipedia.cc/schemas/claude-code-settings.json

#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_local/share/claude/settings/interface.toml
#
#

#
# https://clawdipedia.cc/configure/settings/ui
#

tui           = "fullscreen"
theme         = "custom:chewy-claude"
viewMode      = "focus"
timeZone      = "Australia/Melbourne"
timeFormat    = "%a %d %b - %H:%M:%S"
maxProseWidth = 100

difftool              = "terminal"
editorMode            = "vim"
autoScrollEnabled     = false
vimInsertModeRemaps   = {}
externalEditorContext = true

showTurnDuration               = true
terminalTitleFromRename        = true
terminalProgressBarEnabled     = true
wheelScrollAccelerationEnabled = true

verbose                    = false
feedbackDrafts             = "off"
dialogExpiry               = "never"
feedbackSurveyRate         = 0
preferredNotifChannel      = "terminal_bell"
prefersReducedMotion       = false
promptSuggestionEnabled    = false
syntaxHighlightingDisabled = false

leftArrowOpensAgents   = false
emojiCompletionEnabled = false
footerLinksRegexes     = []

# https://clawdipedia.cc/configure/status-line#settings
[statusLine]
type                 = "command"
command              = "claude-statusline-proxy"
padding              = 0
refreshInterval      = 10
hideVimModeIndicator = true

[voice]
enabled    = false
mode       = "tap"
autoSubmit = false

[spellcheck]
enabled  = false
language = "en_GB"
