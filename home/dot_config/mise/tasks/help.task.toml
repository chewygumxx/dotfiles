[help]
description = "Appends --help | bat --language=help"
usage       = """
arg "<command>" help="Base command"
arg "[subcommand]" var=#true
"""
run         = """
exec "${usage_command}" "${usage_subcommand[@]}" --help | bat --language=help
"""
interactive = true
raw         = true
