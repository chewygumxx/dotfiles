# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://www.schemastore.org/tombi.json
#:tombi toml-version = "v1.1.0"

#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_config/tombi/config.toml
#
#

#
# https://tombi-toml.github.io/tombi/docs/configuration/
#

# Default to TOML 1.0 for compatibility.
toml-version = "v1.0.0"

[format]
[format.rules]
array-bracket-space-width       = 1
date-time-delimiter             = "space"
group-blank-lines-limit         = 2
indent-table-key-value-pairs    = false
indent-width                    = 4
key-value-equals-sign-alignment = true
line-width                      = 80
trailing-comment-alignment      = true
trailing-comment-space-width    = 2

# Mise Configuration
# https://mise.jdx.dev/configuration/reference.html
[[schemas]]
toml-version = "v1.1.0"
path         = "https://mise.jdx.dev/schema/mise.json"
include      = [
    # Project
    "mise.toml",
    "mise.*.toml",
    ".mise.toml",
    ".mise.*.toml",

    # Project + Global + System
    "**/mise/config.toml",
    "**/mise/config.*.toml",
    "**/.mise/config.toml",
    "**/.mise/config.*.toml",
    "**/.config/mise/config.toml",
    "**/.config/mise/config.*.toml",

    # Named Fragment
    "**/mise/conf.d/*.toml",
    "**/.mise/conf.d/*.toml",
    "**/.config/mise/conf.d/*.toml",
]

# Mise TOML Tasks
# https://mise.jdx.dev/tasks/task-discovery.html
[[schemas]]
toml-version = "v1.1.0"
path         = "https://mise.jdx.dev/schema/mise-task.json"
include      = [
    # Default Task Directories
    "mise-tasks/**/*.toml",
    ".mise-tasks/**/*.toml",
    "mise/tasks/**/*.toml",
    ".mise/tasks/**/*.toml",
    ".config/mise/tasks/**/*.toml",

    # chewygumxx Convention
    "*.task.toml"
]
