#:schema tombi://www.schemastore.org/tombi.json
#:tombi toml-version = "v1.1.0"

#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_config/tombi/config.toml
#
#

#
# https://tombi-toml.github.io/tombi/docs/configuration/
#

extends = [ "./mise/tombi.toml" ]

# Default to TOML 1.0 for compatibility.
toml-version = "v1.0.0"

[format]
[format.rules]
array-bracket-space-width       = 1
date-time-delimiter             = "space"
group-blank-lines-limit         = 2
indent-table-key-value-pairs    = false
indent-width                    = 4
key-value-equals-sign-alignment = true
line-width                      = 80
trailing-comment-alignment      = true
trailing-comment-space-width    = 2
