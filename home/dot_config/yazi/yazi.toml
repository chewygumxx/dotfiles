#
#
# ~chewygumxx/dotfiles.git
# ::: :/home/dot_config/yazi/yazi.toml
#
#

[mgr]
ratio          = [ 2, 8, 7 ]
sort_by        = "natural"
sort_sensitive = false           # Case sensitive sort
sort_reverse   = false
sort_dir_first = true
sort_translit  = true            # Sort as if Â = A, Æ = AE, etc.
sort_fallback  = "alphabetical"
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click" ]     # Other options include "drag" and "scroll"

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 900                    # < Preview, preload, and cache
max_height      = 600                    # <
cache_dir       = "~/.local/cache/yazi"
image_delay     = 0                      # alleviate fast scrolling caused lag
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
open     = [
    { run = "xdg-open %s1", desc = "Open", orphan = true },
]
exif     = [
    { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF" },
]
copy     = [
    { run = "wl-copy < %s1", desc = "Copy File to Clipboard" },
]
noop     = [ { run = ":", desc = "Nothing" } ]
text     = [
    { run = "nvim %s", desc = "Neovim", block = true },
    { run = "nvim -R %s", desc = "Neovim (Read Only)", block = true },
    { run = "cat -s %s | wl-copy", desc = "Copy Text to Clipboard" },
]
video    = [
    { run = "mpv %s", desc = "Play", orphan = true },
]
image    = [
    { run = "imv -r %s", desc = "Gallery", orphan = true },
]
audio    = [
    { run = "wezterm start --always-new-process mpv --no-video %s", desc = "Play", orphan = true },
]
media    = [
    { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show mediainfo" },
]
extract  = [
    { run = "ya pub extract --list %s", desc = "Extract here" },
]
download = [
    { run = "ya emit download %S", desc = "Download" },
    { run = "ya emit download --open %S", desc = "Download and open" },
]

[open]
rules = [
    { url = "*/", use = [ "noop", "image" ] },
    { mime = "text/*", use = [ "text", "exif" ] },
    { mime = "inode/empty", use = [ "text" ] },
    { mime = "application/{json,ndjson,javascript,yaml}", use = [ "text", "exif" ] },
    { mime = "audio/*", use = [ "audio", "copy", "media", "exif" ] },
    { mime = "image/*", use = [ "image", "copy", "media", "exif" ] },
    { mime = "image/svg", use = [ "image", "text", "media", "exif" ] },
    { mime = "image/gif", use = [ "image", "video", "copy", "media", "exif" ] },
    { mime = "video/*", use = [ "video", "copy", "media", "exif" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "exif" ] },
    { mime = "vfs/{absent,stale}", use = "download" },
    { url = "*", use = [ "open", "text", "copy", "exif" ] },
]

[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 5
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912         # 512MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false

[plugin]
fetchers   = [
    { url = "*/", run = "mime.dir", prio = "high", group = "mime" },
    { url = "local://*", run = "mime.local", prio = "high", group = "mime" },
    { url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]
spotters   = [
    { mime = "multi/*", run = "multi" },
    { url = "*/", run = "folder" },
    { mime = "text/*", run = "code" },
    { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
    { mime = "image/{avif,hei?,jxl}", run = "magick" },
    { mime = "image/svg+xml", run = "svg" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "vfs/*", run = "vfs" },
    { mime = "null/*", run = "null" },
    { url = "*", run = "file" },
]
preloaders = [
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/bittorrent", run = "torrent-preview" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "font/*", run = "font" },
    { mime = "application/ms-opentype", run = "font" },
]
previewers = [
    { mime = "{image}/*", run = "mediainfo --no-metadata" },
    { mime = "{audio,video}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/bittorrent", run = "torrent-preview" },
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -- "$1"' },
    { mime = "text/*", run = 'piper -- bat --plain --color=always "$1"' },
    { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
    { mime = "application/{json,ndjson}", run = "json" },
    { mime = "application/pdf", run = "pdf" },
    { url = "*.txt.gz", run = 'piper -- gzip -dc "$1"' },
    { url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
    { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
    { url = "*.{AppImage,appimage}", run = "archive" },
    { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
    { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
    { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
    { mime = "font/*", run = "font" },
    { mime = "application/ms-opentype", run = "font" },
    { mime = "inode/empty", run = "empty" },
    { mime = "vfs/*", run = "vfs" },
    { mime = "null/*", run = "null" },
    { url = "*", run = "file" },
    { url = "*/", run = "mux eza_tree_1 eza_tree_2 eza_tree_3" },
]

[input]
cursor_blink  = false
cd_title      = "Change directory:"
cd_origin     = "top-center"
cd_offset     = [ 0, 2, 50, 3 ]
create_title  = [ "Create:", "Create Directory:" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]
find_title    = [ "Find next:", "Find previous:" ]
find_origin   = "top-center"
find_offset   = [ 0, 2, 50, 3 ]
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]
shell_title   = [ "Shell:", "Shell (block):" ]
shell_origin  = "top-center"
shell_offset  = [ 0, 2, 50, 3 ]

[confirm]
trash_title      = "Trash {n} selected file{s}?"
trash_origin     = "center"
trash_offset     = [ 0, 0, 70, 20 ]
delete_title     = "Permanently delete {n} selected file{s}?"
delete_origin    = "center"
delete_offset    = [ 0, 0, 70, 20 ]
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]
quit_title       = "Quit?"
quit_body        = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin      = "center"
quit_offset      = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false
