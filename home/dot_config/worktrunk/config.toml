# ~chewygumxx/dotfiles.git
# ::: :/home/dot_config/worktrunk/config.toml
#
#

#
# https://worktrunk.dev/config/
#

# Typically overwritten by mise via env: WORKTRUNK_WORKTREE_PATH
worktree-path = "~/dev/{{ remote_repo }}.wt/{{ branch | sanitize }}"

# Scripts
# Anything longer than a line lives in ./scripts/, one usage-documented
# (https://usage.jdx.dev) zsh script per entry: `<script> --help`.
# worktrunk runs every entry as `sh -c`, so each calls its script as
#   zsh -c '<script> "$@"' <name> <arguments>
# The arguments stay outside the -c string: worktrunk shell-escapes the
# template variables for sh, and inside it a `$` or backtick in, say, a
# prompt would expand before zsh saw it.

[post-start]
herdr = '''
zsh -c '~/.config/worktrunk/scripts/herdr-register "$@"' herdr-register \
    --repo {{ primary_worktree_path }} {{ branch }} {{ worktree_path }}
'''

[post-remove]
herdr = '''
zsh -c '~/.config/worktrunk/scripts/herdr-close "$@"' herdr-close \
    {{ worktree_path }}
'''

# Toast in herdr once a merge lands, for merges run by agents or elsewhere.
[post-merge]
herdr = """
[ "$HERDR_ENV" = 1 ] || exit 0
herdr notification show Merged \
    --sound done \
    --body "$(printf '%s into %s' {{ branch }} {{ target }})" >/dev/null
"""

# LLM Commit Message Generation
# - `wt step commit`
# - `wt step squash` (never)
# - `wt merge`
#
# https://worktrunk.dev/llm-commits/
[commit.generation]
command = '''
zsh -c '~/.config/worktrunk/scripts/commit-message "$@"' commit-message
'''

# Granularly Commit Doctrine
# A bare [projects] table does not work, worktrunk does not parse
# `projects.merge.squash`
[merge]
squash = false  # Lossless Commit History

# `wt <alias>`. Aliases that forward {{ args }} to a wt command inherit its
# completion, so `wt s <Tab>` completes branches like `wt switch <Tab>`.
# Inspect with `wt config alias show <name>` and `dry-run <name> -- args`;
# a script's own help is `wt <alias> -- --help`.
#
# https://worktrunk.dev/extending/#aliases
[aliases]
l = "wt list {{ args }}"

s  = "wt switch {{ args }}"
ss = "wt switch --create {{ args }}"

cm = "wt step commit {{ args }}"
mg = "wt merge {{ args }}"
rm = "wt remove {{ args }}"

# Commits on this branch that the default branch lacks.
since = "git log --oneline {{ default_branch }}..HEAD {{ args }}"

# wt herdr-open [-c] <branch>
"herdr-open" = '''
zsh -c '~/.config/worktrunk/scripts/herdr-open "$@"' herdr-open \
    --repo {{ primary_worktree_path }} {{ args }}
'''

# wt herdr-workspace [-k <kind>] <branch> [-- <agent args>]
"herdr-workspace" = '''
zsh -c '~/.config/worktrunk/scripts/herdr-workspace "$@"' herdr-workspace \
    --repo {{ primary_worktree_path }} {{ args }}
'''
