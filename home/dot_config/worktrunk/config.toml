# ~chewygumxx/dotfiles.git
# ::: :/home/dot_config/worktrunk/config.toml
#
#

#
# Worktrunk owns worktree creation for:
# - herdr (herdr-worktrunk plugin) and
# - Claude Code (worktrunk plugin's WorktreeCreate/WorktreeRemove hooks).
#
# https://worktrunk.dev/config/
#

# <!-- NOTE(@chewygumxx):
#    - I re-worded this and no longer understand its meaning.
#    -->
#
# Dependant upon agreement with:
#   `.worktrees.directory` of `~/.config/herdr/config.toml`
#
# Each define `<worktree-root-dir>/<repo-name>/<branch-slug>` and thus must
# conform such that herdr native and worktrunk checkouts harmonise.
worktree-path = "~/dev/_worktree/{{ repo }}/{{ branch | sanitize }}"

# Blocking, so .env and friends exist before Claude enters the worktree.
# --require-include matches Claude Code: only gitignored files that are also
# listed in .worktreeinclude get copied.
[pre-start]
copy = "wt step copy-ignored --require-include"

# Show Claude-created worktrees in herdr's sidebar, skipping subagent ones.
# Gated on CLAUDE_PROJECT_DIR so it never races the herdr-worktrunk plugin,
# which registers the worktrees it creates itself. Template variables are
# shell-escaped by worktrunk, so they stay unquoted.
[post-start]
herdr = "case {{ branch }} in agent-*) ;; *) [ -n \"$CLAUDE_PROJECT_DIR\" ] && [ \"$HERDR_ENV\" = 1 ] && herdr worktree open --cwd {{ primary_worktree_path }} --path {{ worktree_path }} --no-focus >/dev/null ;; esac; true"

# LLM commit messages for `wt step commit` and the squash in `wt merge`. The
# prompt arrives on stdin. Haiku without thinking keeps it quick; --safe-mode
# skips hooks and plugins (no herdr state reports from this headless run) and
# --tools='' leaves it nothing to do but answer. git's own commit-msg hook
# still runs on the result, so commitlint has the final say.
# https://worktrunk.dev/llm-commits/
[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

# Personal style for every repo; a repo's .config/wt.toml adds its own rules
template-append = """
- Never use em dashes
- Start the subject with a capital letter
"""

# The dotfiles commit granularly; squashing on merge would undo that
[projects."github.com/chewygumxx/dotfiles"]
merge.squash = false
