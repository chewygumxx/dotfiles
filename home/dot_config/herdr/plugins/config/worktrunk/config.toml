#
# Plugin specification for devashish2203/herdr-worktrunk
#
# The plugin parses this with sed, one `key = value` per line: Keep values on
# a single line and don't nest tables.
#
# https://github.com/devashish2203/herdr-worktrunk
#

# Nest Worktrees
open_mode = "workspace"

# Worktree Picker
picker_placement = "popup"
popup_width      = "60%"
popup_height     = "70%"

# Solidus/Safety/Slugify
slugify_new_branches = true

# Remote Branches
# An exciting prospect for future remotely deployed agents to colloborate.
# Currently, it would serve more context spam than utility.
show_remote_branches = false
