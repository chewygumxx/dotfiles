{"#": " vim: set filetype=json: ",
    
    "#": "Twitter media scraper to replace Imagus",

    "extractor": {
        "download": true,
        "base-directory": "~/net/gallery-dl/harvest/",
        "user-agent": "Mozilla/5.0 (X11; Linux x86_64; rv:150.0) Gecko/20100101 Firefox/150.0",

        "twitter": {
            "cookies": "~/net/gallery-dl/cookies/cookies_twitter.txt",

            "archive": "~/net/gallery-dl/archive/twitter_archive.sqlite3",
            "archive-format": "{tweet_id}_{num}",

            "directory": [ "twitter" ],
            "filename": {
                "count > 1": "twitter_{author.name}_id{tweet_id}_{num}of{count}.{extension}",
                "":          "twitter_{author.name}_id{tweet_id}.{extension}"
            },

            "#": "Filter for media of tolerable resolution",
            "file-filter": [ "width > 400", "height > 400" ],

            "sleep": 1,                    "#": "Seconds to sleep after successful download",
            "sleep-retries": "exp:1.8=40", "#": "Seconds to sleep after failure",

            "videos": "ytdl"
        }
    },

    "downloader": {
        "part-directory": "/tmp/gallery-dl/download_part/",

        "ytdl": {
            "#": "use yt-dlp instead of youtube-dl",
            "module": "yt_dlp"
        }
    },

    "output": {
        "log": {
            "level": "info",

            "#": "use different ANSI colors for each log level",
           "format": {
               "debug"  : "\u001b[0m[debug] {name}: {message}\u001b[0m",
               "info"   : "\u001b[0m[{name}]: {message}\u001b[0m",
               "warning": "\u001b[1;33mWarning: {message}\u001b[0m",
               "error"  : "\u001b[1;31mERROR: {message}\u001b[0m"
           }
        },
        "logfile": {
            "path": "~/net/gallery-dl/log.txt",
            "mode": "a",

            "level" : "info",
            "format": {
                "debug"  : "debug: {message}",
                "info"   : "[{name}] {message}",
                "warning": "Warning: {message}",
                "error"  : "ERROR: {message}"
            }
        },
        "errorfile": {
            "path": "~/net/gallery-dl/url_error.txt",
            "mode": "a"
        },
        "unsupportedfile": {
            "path": "~/net/gallery-dl/url_unsupported.txt",
            "mode": "a"
        }
    }
}
