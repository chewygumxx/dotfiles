{{- if and
    (eq .chezmoi.os   "darwin" "linux" "windows")
    (eq .chezmoi.arch "amd64"  "arm64" "386")
}}

[".local/bin/meteor"]
    type = "archive-file"
    path = "meteor"
    executable = true
    refreshPeriod = "168h"
    url = {{ gitHubLatestReleaseAssetURL
        "stefanlogue/meteor"
        (printf "meteor-%s-%s.zip" .chezmoi.os .chezmoi.arch)
        | quote
    }}

{{- end }}
