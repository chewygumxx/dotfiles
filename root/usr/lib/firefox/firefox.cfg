// AutoConfig-Secondary
//
// https://support.mozilla.org/en-US/kb/customizing-firefox-using-autoconfig
// https://web.mit.edu/~firefox/www/maintainers/autoconfig.html
// https://wiki.archlinux.org/title/Firefox#Settings_storage
//

// No Centralised Management
//
// "autoadmin.global_config_url" is deliberately unset. chezmoi already makes
// this repository the central config, without Firefox evaluating a remote
// file on every start. A remote file also blocks startup until its download
// succeeds or fails, and can persist arbitrary user prefs even sandboxed.
//
// If ever reintroduced: https only, never alongside
// "general.config.sandbox_enabled" false, and never set
// "autoadmin.failover_to_cached" false, which takes Firefox offline and locks
// "network.online" whenever the download fails.
//
