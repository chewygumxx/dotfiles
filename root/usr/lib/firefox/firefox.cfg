//
// AutoConfig-Secondary
//
// https://support.mozilla.org/en-US/kb/customizing-firefox-using-autoconfig
// https://web.mit.edu/~firefox/www/maintainers/autoconfig.html
// https://wiki.archlinux.org/title/Firefox#Settings_storage
//

// Request Email Append
//
// When "autoadmin.append_emailaddr" is true, '?' and the value of "mail.identity.useremail" and each sequentially concatenated to the request.
//
var user = getenv("USER");
lockPref("mail.identity.useremail", user);
lockPref("autoadmin.append_emailaddr", true);

// [LAST] Centralised Management
//
// The URL scheme can be any protocol supported by Firefox, including the `file:`
// protocol to point to a file on a networked drive. The format of the remote
// AutoConfig file is the same as the AutoConfig file on the client, except that
// the first line is not ignored.
//
lockPref("autoadmin.global_config_url", "http://raw.githubusercontent.com/chewygumxx/dotfiles/refs/heads/main/assets/firefox-autoadmin.js");

