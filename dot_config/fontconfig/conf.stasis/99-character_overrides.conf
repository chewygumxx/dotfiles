<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- vim: set filetype=xml:noexpandtab:tabstop=4:shiftwidth=4: -->

<!--


	~/.config/fontconfig/conf.d/60-chewy-character_overrides.conf


-->

<fontconfig>

	<!-- Iconography: Battery -->
	<match>
		<test name="charset">
			<string>F244</string> <!--  Battery   0% Dead			-->
			<string>F243</string> <!--  Battery  25% Quarter		-->
			<string>F242</string> <!--  Battery  50% Half			-->
			<string>F241</string> <!--  Battery  75% Three Quarter	-->
			<string>F240</string> <!--  Battery 100% Full			-->
		</test>
		<edit name="family" mode="prepend">
			<string>MesloLGS NF</string>
		</edit>
	</match>

	<!-- Iconography: Terminal -->
	<match>
		<test name="charset">
			<string>2581</string> <!-- ▁ Lower One Eighth Block	-->
		</test>
		<edit name="family" mode="prepend">
			<string>DejaVu Serif</string>
		</edit>
	</match>
	<match>
		<test name="charset">
			<string>276F</string> <!-- ❯ Heavy Right-Pointing Angle Bracket Ornament	-->
		</test>
		<edit name="family" mode="prepend">
			<string>Noto Sans Symbols 2</string>
		</edit>
	</match>

	<!-- Iconography: Web Browser -->
	<match>
		<test name="charset">
			<string>1F310</string> <!-- 🌐 Globe with Meridians)	-->
		</test>
		<edit name="family" mode="prepend">
			<string>Symobla</string>
		</edit>
	</match>

	<!-- Iconography: Database -->
	<match>
		<test name="charset">
			<string>22C8</string> <!-- ⨝  Bowtie	-->
		</test>
		<edit name="family" mode="prepend">
			<string>Noto Sans Math</string>
		</edit>
	</match>

</fontconfig>

